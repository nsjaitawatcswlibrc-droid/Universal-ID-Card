{% extends 'base.html' %}
{% block title %}Change Password{% endblock %}
{% block page_heading %}Change Password{% endblock %}
{% block content %}
<div class="content-narrow"><div class="page-intro"><span class="eyebrow">ACCOUNT SECURITY</span><h1>पासवर्ड बदलें</h1><p>सुरक्षा के लिए नया पासवर्ड कम से कम 10 अक्षरों का रखें।</p></div><section class="panel"><form method="post" class="form-stack"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>वर्तमान पासवर्ड<input type="password" name="old_password" required></label><label>नया पासवर्ड<input type="password" name="new_password" minlength="10" required></label><label>नया पासवर्ड फिर से दर्ज करें<input type="password" name="confirm_password" minlength="10" required></label><button class="btn btn-primary" type="submit">Update Password</button></form></section></div>
{% endblock %}
